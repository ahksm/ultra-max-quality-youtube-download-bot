name: Build Windows App

# Builds a single-file Windows .exe (Python + ffmpeg bundled inside) and
# publishes it to the repository's Releases page so non-technical users can
# download one file and double-click it.

on:
  push:
    branches:
      - "**"
    paths:
      - "youtube_gui.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download ffmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted
          $exe = Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination ffmpeg.exe
          Write-Host "Bundled ffmpeg from: $($exe.FullName)"

      - name: Build single-file executable
        run: >
          pyinstaller --onefile --windowed --clean
          --name "YouTube-Max-Downloader"
          --add-binary "ffmpeg.exe;."
          youtube_gui.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Max-Downloader-windows
          path: dist/YouTube-Max-Downloader.exe

      - name: Publish to Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build"
          body: |
            Download **YouTube-Max-Downloader.exe** below, then double-click it.
            No installation needed — Python and ffmpeg are bundled inside.

            Windows may show a SmartScreen warning the first time
            ("Windows protected your PC"). Click **More info → Run anyway**.
          files: dist/YouTube-Max-Downloader.exe
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
